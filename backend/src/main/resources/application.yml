spring:
  main:
    allow-bean-definition-overriding: true
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/simulti}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    show-sql: false
    hibernate:
      # validate, never update. Hibernate no longer creates or alters anything in
      # production; it only checks that the schema matches the entities and
      # refuses to start if it does not. database/init.sql is the schema of
      # record. Do NOT put this back to update to "fix" a startup failure - the
      # failure IS the finding, and the fix is an ALTER plus a matching edit to
      # init.sql.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          lob:
            non_contextual_creation: true
          time_zone: UTC
        format_sql: true

logging:
  level:
    root: INFO
    org.springframework.security: INFO
server:
  port: 8080

jwt:
  secret: ${JWT_SECRET:}
  # 4h. This is the value the code has always used; it was previously hardcoded
  # in JwtService while this key advertised 7 days and was read by nothing.
  expiration-ms: ${JWT_EXPIRATION_MS:14400000}

app:
  frontend-url: https://simulti.santoriello.ch
