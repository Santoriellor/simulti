services:
  db:
    image: postgres:16
    container_name: simulti_db
    env_file:
      - /srv/secrets/simulti/db.env
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - simultinet
    restart: unless-stopped
    healthcheck:
      # POSTGRES_USER and POSTGRES_DB come from /srv/secrets/simulti/db.env.
      test: ["CMD-SHELL", "pg_isready -q -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: simulti_backend
    depends_on:
      db:
        # service_healthy, not the default service_started: a started postgres
        # is not an accepting postgres, so the backend used to race the
        # database on every deploy and rely on restart to recover.
        condition: service_healthy
    env_file:
      - /srv/secrets/simulti/db.env
      - /srv/secrets/simulti/jwt.env
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/simulti
      SERVER_PORT: 8080
    networks:
      - simultinet
      - proxy-network
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      # Pin the network Traefik routes over. Containers attached to more than one
      # network leave the choice non-deterministic, and Traefik can pick the internal one.
      - "traefik.docker.network=proxy-network"

      # Backend is served at https://simulti.santoriello.ch/api
      - "traefik.http.routers.simulti-backend.rule=Host(`simulti.santoriello.ch`) && PathPrefix(`/api`)"
      - "traefik.http.routers.simulti-backend.entrypoints=websecure"
      - "traefik.http.routers.simulti-backend.tls.certresolver=le"
      - "traefik.http.routers.simulti-backend.service=simulti-backend"
      # Springboot listens on port 8080
      - "traefik.http.services.simulti-backend.loadbalancer.server.port=8080"
      # security-headers and gzip-compress live in Traefik's file provider.
      # Deliberately NOT applied to simulti-backend-ws: compression does nothing useful
      # on a WebSocket stream, and HSTS is already set on this host by the other routers.
      - "traefik.http.routers.simulti-backend.middlewares=security-headers@file,gzip-compress@file"

      # /ws → backend (WebSocket)
      - "traefik.http.routers.simulti-backend-ws.rule=Host(`simulti.santoriello.ch`) && PathPrefix(`/ws`)"
      - "traefik.http.routers.simulti-backend-ws.entrypoints=websecure"
      - "traefik.http.routers.simulti-backend-ws.tls.certresolver=le"
      - "traefik.http.routers.simulti-backend-ws.service=simulti-backend"
    healthcheck:
      # bash explicitly: /dev/tcp is a bash builtin and this image's /bin/sh is
      # dash. No actuator dependency exists, so a TCP connect is the available
      # readiness signal - Tomcat binds 8080 only after the context loads.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: simulti_frontend
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - proxy-network
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      # Pin the network Traefik routes over. Containers attached to more than one
      # network leave the choice non-deterministic, and Traefik can pick the internal one.
      - "traefik.docker.network=proxy-network"
      - "traefik.http.routers.simulti-frontend.rule=Host(`simulti.santoriello.ch`)"
      - "traefik.http.routers.simulti-frontend.entrypoints=websecure"
      - "traefik.http.routers.simulti-frontend.tls.certresolver=le"
      - "traefik.http.services.simulti-frontend.loadbalancer.server.port=8080"
      - "traefik.http.routers.simulti-frontend.middlewares=security-headers@file,gzip-compress@file"
    healthcheck:
      # busybox wget, present in the alpine nginx image. Port 8080 per Task 6.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  pgdata:

networks:
  simultinet:
  proxy-network:
    external: true
