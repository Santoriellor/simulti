name: Deploy to VPS

on:
  push:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 25
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Run backend tests
        working-directory: backend
        run: mvn -B test

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Read from frontend/.nvmrc rather than repeated here, so the
          # version has one home and CI cannot disagree with a local `nvm use`.
          node-version-file: 'frontend/.nvmrc'

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend tests
        working-directory: frontend
        run: npx ng test --watch=false

  deploy:
    needs: test
    runs-on: ubuntu-latest
    # Guard the ref here as well as in the trigger: if the trigger is ever
    # widened to run this workflow on a branch, this is what stops a feature
    # branch deploying to production.
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up SSH key
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" | tr -d '\r' > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Copy project to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          # --delete makes the VPS mirror the repo. Without it a renamed or removed
          # file lingers on the server forever: this refactor renamed
          # game/GameRoom.java to GameSession.java, rsync copied the new file, left
          # the old one, and the build failed compiling both. Excluded paths are NOT
          # deleted unless --delete-excluded is passed, and /var/www/simulti holds
          # only source - secrets are in /srv/secrets/simulti, data is a volume.
          rsync -avz --delete \
            --exclude ".git" \
            --exclude ".github" \
            --exclude "node_modules" \
            --exclude "backend/target" \
            ./ "$VPS_USER@$VPS_HOST:/var/www/simulti/"

      - name: Build and restart on VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          # No 'docker system prune -f': this host runs six projects and prune
          # removes dangling images and build cache belonging to all of them.
          ssh "$VPS_USER@$VPS_HOST" "
            set -e
            cd /var/www/simulti
            docker compose up -d --build
          "
